name: Northstar deny-only CI acceptance
on:
  push:
    branches: [feature/iios-truth-spine-authority-clock-reconciliation]
  pull_request:
    paths: ['FRONT END/**', 'scripts/truth_spine*', 'BACK END/backend/truth_spine*', 'BACK END/backend/test_truth_spine*', 'tests/northstar/**', '.github/workflows/northstar-offline-acceptance.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: '${{ github.workspace }}:${{ github.workspace }}/scripts:${{ github.workspace }}/BACK END/backend'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: FRONT END
      - run: python -m pip install -r config/production-python-requirements.lock
      - name: Configure disposable synthetic test root
        run: |
          test_root="$(mktemp -d /private/tmp/iios-sb38d-source-tests-ci-XXXXXXXX)"
          chmod 700 "$test_root"
          echo "IIOS_SB38D_TEST_ROOT=$test_root" >> "$GITHUB_ENV"
          echo "TMPDIR=$test_root" >> "$GITHUB_ENV"
      - name: Complete frontend and exact lint baseline
        working-directory: FRONT END
        run: |
          node --test src/*.test.ts
          npm run lint
          node node_modules/typescript/bin/tsc --project tsconfig.app.json --noEmit --incremental false
          npm run build
      - name: Truth Spine and Expansion Wing
        working-directory: BACK END/backend
        run: |
          python -B -m unittest discover -v -s . -p 'test_truth_spine*.py'
          python -B -m unittest discover -v -s expansion_wing -t . -p 'test*.py'
      - name: Isolated compilation and diff
        run: |
          PYTHONPYCACHEPREFIX="$RUNNER_TEMP/northstar-bytecode" python -m compileall -q 'BACK END/backend' scripts
          git diff --check
  browser:
    needs: source
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    env:
      NORTHSTAR_ARTIFACTS: artifacts/frozen-ci
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/tests/northstar/node_modules/.cache/browsers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: FRONT END
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: tests/northstar
      - run: node node_modules/playwright/cli.js install ${{ matrix.engine }}
        working-directory: tests/northstar
      - name: Two deterministic fixture-only builds and contracts
        working-directory: tests/northstar
        run: |
          node prepare.mjs
          npm run test:contracts
      - name: Frozen screenshot, layout, accessibility and lifecycle acceptance
        working-directory: tests/northstar
        run: node run.mjs --project=${{ matrix.engine }}
      - name: Preserve screenshots, traces, diffs and provenance even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: northstar-${{ matrix.engine }}-${{ github.sha }}
          path: |
            tests/northstar/artifacts/
            tests/northstar/.build/contract.json
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error
