name: Alpha Radar synthetic startup diagnostics

on:
  workflow_dispatch:
    inputs:
      native_startup:
        description: Separately authorized single startup-only native attempt
        type: boolean
        required: false
        default: false
      lifecycle_only:
        description: Separate credential-free lifecycle only; OS confinement remains unqualified
        type: boolean
        required: false
        default: false
      full_session_only:
        description: Separate synthetic 475-request qualification; never production or confinement acceptance
        type: boolean
        required: false
        default: false
      throughput_only:
        description: Three sequential six-request throughput diagnostics; never full-session acceptance
        type: boolean
        required: false
        default: false
      tail_measurement_only:
        description: One depth-474 tail and complete lifecycle export diagnostic; never full acceptance
        type: boolean
        required: false
        default: false
      expected_source_commit:
        description: Independently reviewed 40-character source commit; required for native execution
        type: string
        required: false
        default: ''
  push:
    branches: [feature/iios-provider-gateway-superbatch-1]
    paths:
      - .github/workflows/alpha-radar-native-diagnostics.yml
      - tests/native/alpha_radar_*.py
      - tests/native/test_alpha_radar_native.py
      - tests/native/test_alpha_radar_export_process.py
      - tests/native/alpha_radar.sb.in
      - BACK END/backend/truth_spine_process_identity.py
      - BACK END/backend/test_truth_spine_process_identity.py

permissions:
  contents: read

concurrency:
  group: alpha-radar-startup-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validation:
    if: github.ref == 'refs/heads/feature/iios-provider-gateway-superbatch-1'
    runs-on: macos-26
    # Measured 38m37s hosted; 60m leaves >50% headroom, independent of native work.
    timeout-minutes: 60
    outputs:
      proof: ${{ steps.proof.outputs.proof }}
      proof_sha256: ${{ steps.proof.outputs.sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.15'
      - name: Exclusive preparation root; reject reruns
        shell: bash
        run: |
          test "$GITHUB_RUN_ATTEMPT" = 1
          python -B - <<'PY'
          import os, pathlib, tempfile
          root = pathlib.Path(tempfile.mkdtemp(prefix='iios-provider-connection-source-tests-ci-startup-', dir='/private/tmp'))
          (root/'export').mkdir(mode=0o700)
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              stream.write('IIOS_RADAR_CI_ROOT='+str(root)+'\n')
          PY
      - name: Fetch the independently pinned disposable runtime archive
        env:
          IIOS_FULL_PREPARATION: 'false'
        shell: bash
        run: |
          curl --fail --location --proto '=https' --proto-redir '=https' --tlsv1.2 --retry 0 --max-time 120 \
            --output "$IIOS_RADAR_CI_ROOT/python-runtime.tar.gz" \
            'https://github.com/astral-sh/python-build-standalone/releases/download/20260901/cpython-3.13.15%2B20260901-aarch64-apple-darwin-install_only.tar.gz'
          full_args=()
          if [ "$IIOS_FULL_PREPARATION" = true ]; then full_args=(--prepare-full-session); fi
          python -B tests/native/alpha_radar_ci.py prepare --root "$IIOS_RADAR_CI_ROOT" --commit "$GITHUB_SHA" "${full_args[@]}"
      - name: Verify immutable runtime, package, TLS and input closure
        env:
          IIOS_FULL_PREPARATION: 'false'
        shell: bash
        run: |
          full_args=()
          if [ "$IIOS_FULL_PREPARATION" = true ]; then full_args=(--prepare-full-session); fi
          "$IIOS_RADAR_CI_ROOT/runtime/python/bin/python3.13" -B tests/native/alpha_radar_ci.py finalize \
            --root "$IIOS_RADAR_CI_ROOT" --commit "$GITHUB_SHA" "${full_args[@]}"
      - name: Fresh-process evidence export regressions; no fixture or network
        shell: bash
        run: python -I -S -B tests/native/test_alpha_radar_export_process.py --root "$IIOS_RADAR_CI_ROOT"
      - name: Complete mocked harness and process-inspector regressions
        shell: bash
        run: |
          "$IIOS_RADAR_CI_ROOT/runtime/python/bin/python3.13" -B tests/native/alpha_radar_ci.py offline \
            --root "$IIOS_RADAR_CI_ROOT"
      - name: Python compilation and workflow shell syntax; never execute extracted commands
        shell: bash
        run: |
          python -B - <<'PYCODE'
          import ast, hashlib, json, os, pathlib, py_compile, sys
          sys.path.insert(0, 'tests/native')
          import alpha_radar_ci as ci
          root = pathlib.Path(os.environ['IIOS_RADAR_CI_ROOT'])
          names = [name for name in ci.binding_paths() if name.endswith('.py')]
          for index, name in enumerate(names):
              ast.parse(pathlib.Path(name).read_bytes(), filename=name)
              py_compile.compile(name, cfile=str(root/('syntax-%02d.pyc' % index)), doraise=True)
          ci.document(root/'export/python-syntax.json', {'scope':'STATIC_SYNTAX_ONLY', 'success':True,
              'collected':len(names), 'executed':len(names), 'skipped':0, 'source_bindings':ci.source_bindings()})
          PYCODE
          ruby -ryaml -rjson -ropen3 - <<'RUBY'
          file = '.github/workflows/alpha-radar-native-diagnostics.yml'
          data = YAML.safe_load(File.read(file), permitted_classes: [], aliases: false)
          scripts = data.fetch('jobs').values.flat_map { |job| job.fetch('steps').map { |step| step['run'] }.compact }
          scripts.each { |script| _, err, status = Open3.capture3('/bin/bash', '-n', stdin_data: script); raise 'SHELL_SYNTAX_REJECTED' unless status.success? }
          root = ENV.fetch('IIOS_RADAR_CI_ROOT')
          File.open(File.join(root, 'export', 'workflow-syntax.json'), 'wx', 0400) { |out| out.write(JSON.generate({'scope'=>'STATIC_SYNTAX_ONLY','success'=>true,'scripts'=>scripts.length,'executed_commands'=>0})) }
          RUBY
      - name: Bind successful validation to this exact commit and run
        id: proof
        shell: bash
        run: |
          "$IIOS_RADAR_CI_ROOT/runtime/python/bin/python3.13" -B tests/native/alpha_radar_ci.py validation-proof --root "$IIOS_RADAR_CI_ROOT"
          python -B - <<'PYCODE'
          import os, pathlib, base64, hashlib
          data = (pathlib.Path(os.environ['IIOS_RADAR_CI_ROOT'])/'export/validation-proof.json').read_bytes()
          assert len(data) < 24000
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write('proof='+base64.b64encode(data).decode()+'\n')
              stream.write('sha256='+hashlib.sha256(data).hexdigest()+'\n')
          PYCODE
      - name: Preserve structured diagnostics on success or failure
        if: always() && env.IIOS_RADAR_CI_ROOT != ''
        shell: bash
        run: |
          python -B tests/native/alpha_radar_ci.py export --root "$IIOS_RADAR_CI_ROOT"
      - name: Upload sanitized synthetic evidence only
        if: always() && env.IIOS_RADAR_CI_ROOT != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: alpha-radar-validation-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.IIOS_RADAR_CI_ROOT }}/export/
          if-no-files-found: error
          retention-days: 30

  native:
    needs: validation
    if: github.ref == 'refs/heads/feature/iios-provider-gateway-superbatch-1' && github.event_name == 'workflow_dispatch' && inputs.throughput_only != true && inputs.tail_measurement_only != true && (inputs.native_startup == true || inputs.lifecycle_only == true || inputs.full_session_only == true)
    runs-on: macos-26
    # Fresh prep <=300s; admission/startup/TLS 300s; real-clock 65s; work <=6000s (including final reconciliation);
    # cleanup 180s + export 180s + hard-stop margin 60s = 7085s < 120m; 115s remains unallocated.
    # Individual fixture/worker startup phases remain bounded at 100s each.
    timeout-minutes: 120
    env:
      IIOS_EXPECTED_VALIDATION_SHA256: ${{ needs.validation.outputs.proof_sha256 }}
    steps:
      - name: Record native-job clock before checkout or preparation
        shell: bash
        run: |
          python3 -B - <<'PYCODE'
          import os, time
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              stream.write('IIOS_NATIVE_JOB_START='+str(time.monotonic())+'\n')
          PYCODE
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.15'
      - name: Exclusive preparation root; reject reruns
        shell: bash
        run: |
          test "$GITHUB_RUN_ATTEMPT" = 1
          python -B - <<'PY'
          import os, pathlib, tempfile
          root = pathlib.Path(tempfile.mkdtemp(prefix='iios-provider-connection-source-tests-ci-startup-', dir='/private/tmp'))
          (root/'export').mkdir(mode=0o700)
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              stream.write('IIOS_RADAR_CI_ROOT='+str(root)+'\n')
          PY
      - name: Verify the independently pinned validation-job result
        env:
          IIOS_VALIDATION_PROOF: ${{ needs.validation.outputs.proof }}
        shell: bash
        run: python -B tests/native/alpha_radar_ci.py accept-validation --root "$IIOS_RADAR_CI_ROOT"
      - name: Fetch the independently pinned disposable runtime archive
        env:
          IIOS_FULL_PREPARATION: ${{ github.event_name == 'workflow_dispatch' && inputs.full_session_only == true }}
        shell: bash
        run: |
          curl --fail --location --proto '=https' --proto-redir '=https' --tlsv1.2 --retry 0 --max-time 120 \
            --output "$IIOS_RADAR_CI_ROOT/python-runtime.tar.gz" \
            'https://github.com/astral-sh/python-build-standalone/releases/download/20260901/cpython-3.13.15%2B20260901-aarch64-apple-darwin-install_only.tar.gz'
          full_args=()
          if [ "$IIOS_FULL_PREPARATION" = true ]; then full_args=(--prepare-full-session); fi
          python -B tests/native/alpha_radar_ci.py prepare --root "$IIOS_RADAR_CI_ROOT" --commit "$GITHUB_SHA" "${full_args[@]}"
      - name: Verify immutable runtime, package, TLS and input closure
        env:
          IIOS_FULL_PREPARATION: ${{ github.event_name == 'workflow_dispatch' && inputs.full_session_only == true }}
        shell: bash
        run: |
          full_args=()
          if [ "$IIOS_FULL_PREPARATION" = true ]; then full_args=(--prepare-full-session); fi
          "$IIOS_RADAR_CI_ROOT/runtime/python/bin/python3.13" -B tests/native/alpha_radar_ci.py finalize \
            --root "$IIOS_RADAR_CI_ROOT" --commit "$GITHUB_SHA" "${full_args[@]}"
      - name: Exactly one confined fixture startup; never launch a worker
        if: github.event_name == 'workflow_dispatch' && inputs.native_startup == true && inputs.lifecycle_only != true && inputs.full_session_only != true
        shell: bash
        env:
          IIOS_EXPECTED_SOURCE_COMMIT: ${{ inputs.expected_source_commit }}
        run: |
          "$IIOS_RADAR_CI_ROOT/runtime/python/bin/python3.13" -B tests/native/alpha_radar_ci.py execute --native-startup \
            --root "$IIOS_RADAR_CI_ROOT"
      - name: Manual lifecycle only; no sandbox or worker
        if: github.event_name == 'workflow_dispatch' && inputs.lifecycle_only == true && inputs.native_startup != true && inputs.full_session_only != true
        shell: bash
        env:
          IIOS_EXPECTED_SOURCE_COMMIT: ${{ inputs.expected_source_commit }}
        run: |
          "$IIOS_RADAR_CI_ROOT/runtime/python/bin/python3.13" -B tests/native/alpha_radar_ci.py lifecycle --lifecycle-only \
            --root "$IIOS_RADAR_CI_ROOT"
      - name: Manual full synthetic session; no production or confinement qualification
        if: github.event_name == 'workflow_dispatch' && inputs.full_session_only == true && inputs.native_startup != true && inputs.lifecycle_only != true
        shell: bash
        run: |
          "$IIOS_RADAR_CI_ROOT/runtime/python/bin/python3.13" -B tests/native/alpha_radar_ci.py full-session --full-session-only \
            --root "$IIOS_RADAR_CI_ROOT"
      - name: Preserve structured diagnostics on success or failure
        if: always() && env.IIOS_RADAR_CI_ROOT != ''
        shell: bash
        run: |
          python -B tests/native/alpha_radar_ci.py export --root "$IIOS_RADAR_CI_ROOT"
      - name: Upload sanitized synthetic evidence only
        if: always() && env.IIOS_RADAR_CI_ROOT != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: alpha-radar-native-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.IIOS_RADAR_CI_ROOT }}/export/
          if-no-files-found: error
          retention-days: 30

  tail-measurement:
    needs: validation
    if: github.ref == 'refs/heads/feature/iios-provider-gateway-superbatch-1' && github.event_name == 'workflow_dispatch' && inputs.throughput_only != true && inputs.tail_measurement_only == true && inputs.native_startup != true && inputs.lifecycle_only != true && inputs.full_session_only != true
    runs-on: macos-26
    timeout-minutes: 20
    env:
      IIOS_EXPECTED_VALIDATION_SHA256: ${{ needs.validation.outputs.proof_sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.15'
      - name: Exclusive diagnostic preparation
        timeout-minutes: 5
        env:
          IIOS_VALIDATION_PROOF: ${{ needs.validation.outputs.proof }}
        shell: bash
        run: |
          test "$GITHUB_RUN_ATTEMPT" = 1
          root=$(mktemp -d /private/tmp/iios-provider-connection-source-tests-tail-ci-XXXXXXXX)
          mkdir "$root/export"
          chmod 700 "$root/export"
          echo "IIOS_RADAR_CI_ROOT=$root" >> "$GITHUB_ENV"
          python -B tests/native/alpha_radar_ci.py accept-validation --root "$root"
          curl --fail --location --proto '=https' --proto-redir '=https' --tlsv1.2 --retry 0 --max-time 120 --output "$root/python-runtime.tar.gz" 'https://github.com/astral-sh/python-build-standalone/releases/download/20260901/cpython-3.13.15%2B20260901-aarch64-apple-darwin-install_only.tar.gz'
          python -B tests/native/alpha_radar_ci.py prepare --root "$root" --commit "$GITHUB_SHA" --tail-measurement-only
          "$root/runtime/python/bin/python3.13" -B tests/native/alpha_radar_ci.py finalize --root "$root" --commit "$GITHUB_SHA" --tail-measurement-only
      - name: One depth-474 diagnostic and complete local export
        id: measured
        shell: bash
        run: |
          "$IIOS_RADAR_CI_ROOT/runtime/python/bin/python3.13" -B tests/native/alpha_radar_ci.py tail-measurement --tail-measurement-only --root "$IIOS_RADAR_CI_ROOT"
      - name: Upload complete diagnostic evidence within remaining export reserve
        id: uploaded
        if: always() && steps.measured.outputs.upload_minutes != ''
        timeout-minutes: ${{ fromJSON(steps.measured.outputs.upload_minutes) }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: alpha-radar-tail-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.IIOS_RADAR_CI_ROOT }}/export/
          if-no-files-found: error
          retention-days: 30
      - name: Record upload observation and enforce independent export reserve
        if: always() && steps.measured.outputs.upload_minutes != ''
        env:
          UPLOAD_OUTCOME: ${{ steps.uploaded.outcome }}
        shell: bash
        run: |
          python -B - <<'PYCODE'
          import os,json,time,pathlib
          p=pathlib.Path(os.environ['IIOS_RADAR_CI_ROOT'])/'export/tail-export.json'
          v=json.loads(p.read_bytes());end=time.monotonic_ns()
          result={'scope':'CI_TAIL_EXPORT_DIAGNOSTIC_ONLY','upload_outcome':os.environ['UPLOAD_OUTCOME'],
              'upload_and_step_transition_seconds':(end-v['end_ns'])/1e9,
              'complete_export_elapsed_seconds':(end-v['start_ns'])/1e9,
              'within_export_deadline':end<v['deadline_ns'],'timing':'OBSERVATION_NOT_GUARANTEE',
              'production_qualified':False,'broker_connected':False,'paper_order_permission':False,
              'trade_execution_permission':False,'live_execution':False}
          print(json.dumps(result,sort_keys=True))
          assert result['within_export_deadline'] and result['upload_outcome']=='success'
          PYCODE

  throughput-measurement:
    needs: validation
    if: github.ref == 'refs/heads/feature/iios-provider-gateway-superbatch-1' && github.event_name == 'workflow_dispatch' && inputs.throughput_only == true && inputs.tail_measurement_only != true && inputs.native_startup != true && inputs.lifecycle_only != true && inputs.full_session_only != true
    runs-on: macos-26
    timeout-minutes: 40
    env:
      IIOS_EXPECTED_VALIDATION_SHA256: ${{ needs.validation.outputs.proof_sha256 }}
    steps:
      - name: Bind the shared 2400-second clock before preparation
        shell: bash
        run: |
          python3 -B - <<'PYCODE'
          import os,time
          with open(os.environ['GITHUB_ENV'],'a') as stream:
              stream.write('IIOS_THROUGHPUT_SERIES_START_NS='+str(time.monotonic_ns())+'\n')
          PYCODE
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.15'
      - name: Prepare depth 0 with fresh pins inside its 800-second bound
        env:
          IIOS_VALIDATION_PROOF: ${{ needs.validation.outputs.proof }}
        shell: bash
        run: |
          test "$GITHUB_RUN_ATTEMPT" = 1
          export IIOS_THROUGHPUT_CASE_START_NS=$(python -B -c 'import time; print(time.monotonic_ns())')
          root=$(mktemp -d /private/tmp/iios-provider-connection-source-tests-throughput-ci-XXXXXXXX)
          mkdir "$root/export"
          chmod 700 "$root/export"
          echo "IIOS_THROUGHPUT_CASE_START_NS=$IIOS_THROUGHPUT_CASE_START_NS" >> "$GITHUB_ENV"
          echo "IIOS_THROUGHPUT_ROOT_0=$root" >> "$GITHUB_ENV"
          python -B tests/native/alpha_radar_ci.py accept-validation --root "$root"
          curl --fail --location --proto '=https' --proto-redir '=https' --tlsv1.2 --retry 0 --max-time 120 --output "$root/python-runtime.tar.gz" 'https://github.com/astral-sh/python-build-standalone/releases/download/20260901/cpython-3.13.15%2B20260901-aarch64-apple-darwin-install_only.tar.gz'
          python -B tests/native/alpha_radar_ci.py prepare --root "$root" --commit "$GITHUB_SHA" --throughput-only --throughput-depth 0
          "$root/runtime/python/bin/python3.13" -B tests/native/alpha_radar_ci.py finalize --root "$root" --commit "$GITHUB_SHA" --throughput-only --throughput-depth 0
      - name: Execute six requests at depth 0 and export verified evidence
        id: measured0
        shell: bash
        run: |
          "$IIOS_THROUGHPUT_ROOT_0/runtime/python/bin/python3.13" -B tests/native/alpha_radar_ci.py throughput --throughput-only --throughput-depth 0 --root "$IIOS_THROUGHPUT_ROOT_0"
      - name: Preserve failure evidence even if depth 0 admission did not launch
        id: exportgate0
        if: always() && env.IIOS_THROUGHPUT_ROOT_0 != ''
        shell: bash
        run: |
          python -B - <<'PYCODE'
          import os,time,json,pathlib,sys
          sys.path.insert(0,'tests/native')
          import alpha_radar_ci as ci
          root=pathlib.Path(os.environ['IIOS_THROUGHPUT_ROOT_0']);ci.root_check(root)
          p=root/'export/throughput-export.json';now=time.monotonic_ns()
          if p.exists(): v=json.loads(p.read_bytes())
          else:
              v={**ci.THROUGHPUT_FLAGS,'start_ns':now,'end_ns':now,
                  'deadline_ns':min(int(os.environ['IIOS_THROUGHPUT_CASE_START_NS'])+800000000000,now+180000000000),
                  'execution_qualified':False,'reason':'INCOMPLETE_CASE_EVIDENCE'}
              ci.document(root/'export/throughput-failure-export.json',v)
          minutes=ci.tail_upload_minutes(v['deadline_ns'],time.monotonic_ns())
          with open(os.environ['GITHUB_OUTPUT'],'a') as stream:stream.write('upload_minutes='+str(minutes)+'\n')
          PYCODE
      - name: Upload depth 0 before proceeding to another case
        id: uploaded0
        if: always() && steps.exportgate0.outputs.upload_minutes != ''
        timeout-minutes: ${{ fromJSON(steps.exportgate0.outputs.upload_minutes) }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: alpha-radar-throughput-0-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.IIOS_THROUGHPUT_ROOT_0 }}/export/
          if-no-files-found: error
          retention-days: 30
      - name: Verify depth 0 upload and independent reserve
        if: always() && steps.exportgate0.outputs.upload_minutes != ''
        env:
          UPLOAD_OUTCOME: ${{ steps.uploaded0.outcome }}
        shell: bash
        run: |
          python -B - <<'PYCODE'
          import os,time,json,pathlib
          root=pathlib.Path(os.environ['IIOS_THROUGHPUT_ROOT_0'])
          p=root/'export/throughput-export.json'
          if not p.exists():p=root/'export/throughput-failure-export.json'
          v=json.loads(p.read_bytes());end=time.monotonic_ns()
          value={'scope':'CI_SYNTHETIC_THROUGHPUT_DIAGNOSTIC_ONLY','depth':0,
              'upload_seconds':(end-v['end_ns'])/1e9,'export_total_seconds':(end-v['start_ns'])/1e9,
              'within_deadline':end<v['deadline_ns'],'upload_outcome':os.environ['UPLOAD_OUTCOME'],
              'timing':'OBSERVATION_NOT_GUARANTEE','production_qualified':False,
              'broker_connected':False,'paper_order_permission':False,'trade_execution_permission':False,'live_execution':False}
          print(json.dumps(value,sort_keys=True))
          assert value['within_deadline'] and value['upload_outcome']=='success'
          assert end<int(os.environ['IIOS_THROUGHPUT_SERIES_START_NS'])+2400000000000
          PYCODE
      - name: Prepare depth 237 with fresh pins inside its 800-second bound
        env:
          IIOS_VALIDATION_PROOF: ${{ needs.validation.outputs.proof }}
        shell: bash
        run: |
          test "$GITHUB_RUN_ATTEMPT" = 1
          export IIOS_THROUGHPUT_CASE_START_NS=$(python -B -c 'import time; print(time.monotonic_ns())')
          root=$(mktemp -d /private/tmp/iios-provider-connection-source-tests-throughput-ci-XXXXXXXX)
          mkdir "$root/export"
          chmod 700 "$root/export"
          echo "IIOS_THROUGHPUT_CASE_START_NS=$IIOS_THROUGHPUT_CASE_START_NS" >> "$GITHUB_ENV"
          echo "IIOS_THROUGHPUT_ROOT_237=$root" >> "$GITHUB_ENV"
          python -B tests/native/alpha_radar_ci.py accept-validation --root "$root"
          curl --fail --location --proto '=https' --proto-redir '=https' --tlsv1.2 --retry 0 --max-time 120 --output "$root/python-runtime.tar.gz" 'https://github.com/astral-sh/python-build-standalone/releases/download/20260901/cpython-3.13.15%2B20260901-aarch64-apple-darwin-install_only.tar.gz'
          python -B tests/native/alpha_radar_ci.py prepare --root "$root" --commit "$GITHUB_SHA" --throughput-only --throughput-depth 237
          "$root/runtime/python/bin/python3.13" -B tests/native/alpha_radar_ci.py finalize --root "$root" --commit "$GITHUB_SHA" --throughput-only --throughput-depth 237
      - name: Execute six requests at depth 237 and export verified evidence
        id: measured237
        shell: bash
        run: |
