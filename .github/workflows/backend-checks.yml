name: IIOS checks

on:
  push:
    branches:
      - feature/governed-chain-v1
  pull_request:
    branches:
      - main

jobs:
  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BACK END/backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: pip install fastapi uvicorn openai python-dotenv certifi
      - name: Compile backend
        run: python -m py_compile app.py main.py ledger.py dashboard_lineage.py evidence_engine.py gap_quality.py portfolio_context.py analyst_consensus_fallback.py short_interest_fallback.py primary_evidence_contracts.py primary_evidence.py primary_evidence_semantic_guard.py hyperscaler_primary_fallback.py hyperscaler_contract_context.py supply_inventory_primary_fallback.py valuation_market_primary_fallback.py valuation_market_micron_filing_fallback.py requirement_lineage_guard.py hard_data.py insider_intelligence.py insider_ir_fallback.py insider_secondary_fallback.py insider_scope_guard.py institutional_intelligence.py institutional_secondary_fallback.py institutional_integrity_guard.py source_ingestion.py provider_hardening.py official_sources.py public_factory.py public_case_router.py learning_loop.py monitoring_engine.py semiconductor_intelligence.py decision_history.py evidence_gap_hunter.py interview_portal.py chain_verifier.py run_v03_simulation.py run_v05_learning_simulation.py test_ledger.py test_factory_chain.py test_dashboard_lineage.py test_evidence_engine.py test_gap_quality.py test_portfolio_context.py test_analyst_consensus_fallback.py test_short_interest_fallback.py test_primary_evidence.py test_primary_evidence_single_fact.py test_hyperscaler_primary_fallback.py test_hyperscaler_contract_context.py test_supply_inventory_primary_fallback.py test_valuation_market_primary_fallback.py test_valuation_market_micron_filing_fallback.py test_requirement_lineage_guard.py test_hard_data.py test_insider_intelligence.py test_insider_ir_fallback.py test_insider_secondary_fallback.py test_insider_scope_guard.py test_institutional_intelligence.py test_institutional_secondary_fallback.py test_institutional_integrity_guard.py test_source_ingestion.py test_provider_hardening.py test_official_sources.py test_chain_verifier.py test_learning_loop.py test_monitoring_engine.py test_semiconductor_intelligence.py test_decision_history.py test_evidence_gap_hunter.py test_interview_portal.py
      - name: Run backend tests
        run: python -m unittest -v test_ledger.py test_factory_chain.py test_dashboard_lineage.py test_evidence_engine.py test_gap_quality.py test_portfolio_context.py test_analyst_consensus_fallback.py test_short_interest_fallback.py test_primary_evidence.py test_primary_evidence_single_fact.py test_hyperscaler_primary_fallback.py test_hyperscaler_contract_context.py test_supply_inventory_primary_fallback.py test_valuation_market_primary_fallback.py test_valuation_market_micron_filing_fallback.py test_requirement_lineage_guard.py test_hard_data.py test_insider_intelligence.py test_insider_ir_fallback.py test_insider_secondary_fallback.py test_insider_scope_guard.py test_institutional_intelligence.py test_institutional_secondary_fallback.py test_institutional_integrity_guard.py test_source_ingestion.py test_provider_hardening.py test_official_sources.py test_chain_verifier.py test_learning_loop.py test_monitoring_engine.py test_semiconductor_intelligence.py test_decision_history.py test_evidence_gap_hunter.py test_interview_portal.py

  build-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FRONT END
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: FRONT END/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Build Factory UI
        run: npm run build