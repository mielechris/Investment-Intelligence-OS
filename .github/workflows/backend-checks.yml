name: IIOS checks

on:
  push:
    branches:
      - feature/governed-chain-v1
  pull_request:
    branches:
      - main

jobs:
  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BACK END/backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: pip install fastapi uvicorn openai python-dotenv certifi
      - name: Compile backend
        run: >-
          python -m py_compile
          app.py main.py ledger.py dashboard_lineage.py evidence_engine.py gap_quality.py
          portfolio_context.py analyst_consensus_fallback.py short_interest_fallback.py
          finra_short_interest_fallback.py options_positioning_occ.py primary_evidence_contracts.py
          primary_evidence.py primary_evidence_semantic_guard.py hyperscaler_primary_fallback.py
          hyperscaler_contract_context.py supply_inventory_primary_fallback.py
          valuation_market_primary_fallback.py valuation_market_micron_filing_fallback.py
          requirement_lineage_guard.py hard_data.py insider_intelligence.py insider_ir_fallback.py
          insider_secondary_fallback.py insider_scope_guard.py institutional_intelligence.py
          institutional_secondary_fallback.py institutional_integrity_guard.py source_ingestion.py
          research_source_cache.py provider_hardening.py official_sources.py public_factory.py
          public_case_router.py market_event_radar.py opportunity_acquisition.py
          opportunity_evidence.py opportunity_evidence_hardening.py adaptive_research_queue.py
          eight_agent_orchestrator.py orchestration_runtime.py orchestration_resilience.py
          orchestration_speed.py orchestration_worker_pool.py orchestration_ab_benchmark.py
          production_safety_freeze.py production_safety_stress.py opportunity_dispatch.py
          opportunity_scheduler.py learning_loop.py monitoring_engine.py
          semiconductor_intelligence.py decision_history.py evidence_gap_hunter.py
          interview_portal.py chain_verifier.py governed_paper_execution_api.py
          governed_paper_execution_bridge.py paper_authorization_api.py
          governed_paper_authorization.py automatic_paper_sizing.py paper_sizing_profile.py
          paper_position_sizing.py capital_entry_watch.py paper_capital_gate.py
          paper_capital_api.py live_invalidation_mapper.py thesis_invalidation_contract.py
      - name: Run opportunity and orchestration safety tests
        run: >-
          PYTHONWARNINGS="error::ResourceWarning" python -m unittest -v
          test_market_event_radar.py test_opportunity_acquisition.py test_opportunity_evidence.py
          test_research_source_cache.py test_adaptive_research_queue.py
          test_eight_agent_orchestrator.py test_orchestration_runtime.py
          test_orchestration_resilience.py test_orchestration_speed.py
          test_orchestration_worker_pool.py test_orchestration_ab_benchmark.py
          test_opportunity_router_integration.py test_opportunity_dispatch.py
          test_opportunity_scheduler.py
      - name: Run governed paper-chain safety tests
        run: >-
          PYTHONWARNINGS="error::ResourceWarning" python -m unittest -v
          test_governed_chain_end_to_end.py test_governed_paper_execution_api.py
          test_governed_paper_execution_bridge.py test_paper_authorization_api.py
          test_governed_paper_authorization.py test_automatic_paper_sizing.py
          test_paper_sizing_profile.py test_paper_position_sizing.py
          test_capital_entry_watch.py test_paper_capital_gate.py test_paper_capital_api.py
          test_live_invalidation_mapper.py test_thesis_invalidation_contract.py
      - name: Run production stress and safety freeze
        run: >-
          PYTHONWARNINGS="error::ResourceWarning" python -m unittest -v
          test_production_safety_stress.py test_adaptive_research_queue.py
          test_orchestration_resilience.py test_governed_chain_end_to_end.py
          test_governed_paper_execution_bridge.py test_governed_paper_authorization.py
      - name: Run backend regression tests
        run: >-
          python -m unittest -v
          test_ledger.py test_factory_chain.py test_dashboard_lineage.py test_evidence_engine.py
          test_gap_quality.py test_portfolio_context.py test_analyst_consensus_fallback.py
          test_short_interest_fallback.py test_finra_short_interest_fallback.py
          test_options_positioning_occ.py test_primary_evidence.py test_primary_evidence_single_fact.py
          test_hyperscaler_primary_fallback.py test_hyperscaler_contract_context.py
          test_supply_inventory_primary_fallback.py test_valuation_market_primary_fallback.py
          test_valuation_market_micron_filing_fallback.py test_requirement_lineage_guard.py
          test_hard_data.py test_insider_intelligence.py test_insider_ir_fallback.py
          test_insider_secondary_fallback.py test_insider_scope_guard.py
          test_institutional_intelligence.py test_institutional_secondary_fallback.py
          test_institutional_integrity_guard.py test_source_ingestion.py test_provider_hardening.py
          test_official_sources.py test_chain_verifier.py test_learning_loop.py
          test_monitoring_engine.py test_semiconductor_intelligence.py test_decision_history.py
          test_evidence_gap_hunter.py test_interview_portal.py

  build-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FRONT END
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: FRONT END/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Build Factory UI
        run: npm run build
