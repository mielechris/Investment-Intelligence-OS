nnerTests.test_inspector_exception_no_signal', 'test_truth_spine_runner.RunnerTests.test_graceful_exit_untracks_only_after_wait', 'test_truth_spine_runner.RunnerTests.test_already_reaped_verified_child_never_signaled', 'test_truth_spine_runner.RunnerTests.test_timeout_force_stop_reverifies', 'test_truth_spine_runner.RunnerTests.test_identity_changes_after_timeout_no_force', 'test_truth_spine_runner.RunnerTests.test_terminate_exception_retains_child', 'test_truth_spine_runner.RunnerTests.test_wait_exception_retains_child', 'test_truth_spine_runner.RunnerTests.test_force_exception_retains_child', 'test_truth_spine_runner.RunnerTests.test_force_wait_timeout_retains_child', 'test_truth_spine_runner.RunnerTests.test_reverse_cleanup_continues_after_first_child_failure', 'test_truth_spine_runner.RunnerTests.test_all_stops_fail_still_close_logs_and_check_port', 'test_truth_spine_runner.RunnerTests.test_log_close_failure_does_not_skip_other_log', 'test_truth_spine_runner.RunnerTests.test_occupied_port_is_red', 'test_truth_spine_runner.RunnerTests.test_port_check_exception_is_red', 'test_truth_spine_runner.RunnerTests.test_normal_persistence_failure_emergency_and_other_output_attempted', 'test_truth_spine_runner.RunnerTests.test_all_persistence_failure_remains_red', 'test_truth_spine_runner.RunnerTests.test_repeated_cleanup_has_no_extra_signals_or_writes', 'test_truth_spine_runner.RunnerTests.test_partial_startup_unverified_child_never_signaled', 'test_truth_spine_runner.RunnerTests.test_keyboard_interrupt_still_cleans_up', 'test_truth_spine_runner.RunnerTests.test_primary_and_cleanup_exceptions_preserved_sanitized', 'test_truth_spine_runner.RunnerTests.test_unrestricted_runner_failure_not_persisted', 'test_truth_spine_runner.RunnerTests.test_complete_atomic_reports', 'test_truth_spine_runner.RunnerTests.test_atomic_failure_preserves_prior_bytes', 'test_truth_spine_runner.RunnerTests.test_atomic_writer_rejects_escape_and_symlink', 'test_truth_spine_runner.RunnerTests.test_unknown_executable_pin_rejects_spawn', 'test_truth_spine_runner.RunnerTests.test_duplicate_reaped_rejection_preserves_owner_and_events', 'test_truth_spine_runner.RunnerTests.test_duplicate_wrong_success_is_failure', 'test_truth_spine_runner.RunnerTests.test_live_duplicate_verified_before_rejection', 'test_truth_spine_runner.RunnerTests.test_live_duplicate_timeout_retained_for_verified_cleanup', 'test_truth_spine_runner.RunnerTests.test_unverified_duplicate_never_signaled', 'test_truth_spine_runner.RunnerTests.test_duplicate_lock_or_event_mutation_rejected', 'test_truth_spine_runner.RunnerTests.test_stop_keyboard_interrupt_still_attempts_other_children', 'test_truth_spine_runner.RunnerTests.test_bound_timeout_required', 'test_truth_spine_runner.RunnerTests.test_macos_inspector_fixed_bounded_commands', 'test_truth_spine_runner.RunnerTests.test_macos_missing_process_none', 'test_truth_spine_runner.RunnerTests.test_macos_inspection_timeout_and_oversize_fail_closed', 'test_truth_spine_runner.RunnerTests.test_port_inspection_errors_never_mistaken_for_clear', 'test_truth_spine_runner.RunnerTests.test_readiness_failure_requires_both_503', 'test_truth_spine_session.LifecycleTests', 'test_truth_spine_session.StoreTests', 'test_truth_spine_session.SupervisorTests', 'test_truth_spine_session.ProductionPathTests', 'test_truth_spine_session.SQLiteTransactionSnapshotTests', 'test_truth_spine_session.ObservationPublicationTests', 'test_truth_spine_session.ObservationCIContractTests', 'test_alpha_runtime_files', 'test_deployment_contract.FrameworkRuntimeTests', 'test_deployment_contract.DeploymentContractTest.test_runtime_contract_rejects_writable_missing_symlink_version_and_release_mismatch']
          source=Path.cwd();root=Path(os.environ['IIOS_GATEWAY_TEST_ROOT']);spine=Path(os.environ['IIOS_SB38D_TEST_ROOT'])
          evidence=root/'evidence';evidence.mkdir(mode=0o700)
          def sha(b):return hashlib.sha256(b).hexdigest()
          def put(name,value):
              with (evidence/name).open('x') as f:json.dump(value,f,sort_keys=True,indent=2,allow_nan=False)
          def git(*args):return subprocess.check_output(['git',*args],cwd=source)
          head=git('rev-parse','HEAD').decode().strip();tree=git('rev-parse','HEAD^{tree}').decode().strip()
          historical=json.loads((root/'historical-bases.json').read_text())
          assert historical==dict(head=head,bases=[BASE,'ae465e1d41f895e2e5fc1b8ee85b628270f7c74e'],verified=True)
          put('historical-bases.json',historical)
          event=os.environ['GITHUB_EVENT_NAME'];ref=os.environ['GITHUB_REF']
          assert event in ('push','pull_request') and head==os.environ['GITHUB_SHA']
          assert event!='push' or ref=='refs/heads/feature/iios-production-session-contract'
          assert not git('status','--porcelain')
          changed=git('diff','--name-only',BASE,head).decode().splitlines()
          assert set(changed)<=set(ALLOWED) and changed
          tracked=git('ls-files','-z').decode().split('\0')[:-1]
          inventory={p:dict(bytes=len((source/p).read_bytes()),sha256=sha((source/p).read_bytes())) for p in tracked}
          put('source.json',dict(scope='PREPARATION_OFFLINE_ONLY',head=head,tree=tree,event=event,ref=ref,
              run_id=os.environ['GITHUB_RUN_ID'],run_attempt=os.environ['GITHUB_RUN_ATTEMPT'],
              workflow_sha=os.environ.get('GITHUB_WORKFLOW_SHA'),inventory=inventory,changed=changed))
          for p in changed:
              if p.endswith('.py'):ast.parse((source/p).read_bytes());compile((source/p).read_bytes(),p,'exec')
          # Unchanged scoped scanner rules; exact legacy occurrences reviewed against BASE.
          RULES={'usable_key':r'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----',
              'github_token':r'gh[pousr]_[A-Za-z0-9]{30,}', 'aws_key':r'AKIA[A-Z0-9]{16}',
              'private_path':'/'+'Users/|/'+'private/tmp/',
              'secret_assignment':'(?i)(?:api[_-]?key|password|access_token)\\s*[:=]\\s*["\'][A-Za-z0-9+/=_-]{24,}'}
          REVIEWED_PRIVATE_LINES=[['BACK END/backend/test_truth_spine_process_identity.py', '89f933b226b5bbf4b75d108250f93f1f0e3f093344afe1fd3167a33d003054af'], ['BACK END/backend/test_truth_spine_process_identity.py', '060e74ce97d13e8a7eaca798b47daf6c31c715fdae4c4bbed1e8f3ec278740c2'], ['BACK END/backend/test_truth_spine_session.py', '1bbced224fa712dbdc2c447f3df389dd301be1114a6ad29161a7bd3c3f2d2838'], ['BACK END/backend/truth_spine_session_package.py', 'e37f8abffb344848eff2ebe17dd3451df927d84bf81dc82b9cd9d20fe348b89f'], ['BACK END/backend/test_alpha_production_runtime.py', '5097ffc2cbd518683e10c0fcfed5cae43193bedd728550410033492f987f6261'], ['BACK END/backend/test_deployment_contract.py', '74927592b63280f50c9af0f52571ea4b953d2a27dfc102605edcafb6142e60e7']]
          findings=[]
          for name in ALLOWED:
              for number,line in enumerate((source/name).read_text().splitlines(),1):
                  for rule,pattern in RULES.items():
                      if re.search(pattern,line):
                          line_hash=sha(line.encode())
                          reviewed=rule=='private_path' and [name,line_hash] in REVIEWED_PRIVATE_LINES
                          if reviewed:
                              reviewed=line in git('show',BASE+':'+name).decode().splitlines()
                          findings.append(dict(path=name,line=number,rule=rule,line_sha256=line_hash,
                              file_sha256=inventory[name]['sha256'],disposition='REVIEWED_UNCHANGED_BASELINE' if reviewed else 'BLOCKED'))
          put('security.json',dict(rules=RULES,findings=findings,base=BASE,scanner_changed=False))
          assert len(findings)==len(REVIEWED_PRIVATE_LINES) and all(f['disposition']=='REVIEWED_UNCHANGED_BASELINE' for f in findings)
          sys.path.insert(0,str(source/'BACK END/backend'));sys.path.insert(0,str(source/'scripts'));sys.path.insert(0,str(source/'tests/native'));sys.dont_write_bytecode=True
          blocked=[]
          # Lexical rejection precedes filesystem access. Descriptor-relative opens are
          # resolved from descriptors issued by this wrapper, never from an untrusted cwd.
          roots=(str(root),str(spine));fds={};active=[];real_open=os.open;real_close=os.close;real_dup=os.dup
          protected={'keychains','ledgers','ledger','.ssh','.aws','credentials'}
          def lexical(value):
              if not isinstance(value,(str,bytes,os.PathLike)):raise PermissionError('PATH_TYPE')
              value=os.fsdecode(os.fspath(value));p=PurePosixPath(value)
              if '\0' in value or '..' in p.parts or any(x.lower() in protected or x.startswith('~') for x in p.parts):
                  raise PermissionError('PROTECTED_PATH')
              return str(p)
          def allowed_write(path):
              return any(path==r or path.startswith(r+'/') for r in roots)
          def scoped_open(path,flags,mode=0o777,*,dir_fd=None):
