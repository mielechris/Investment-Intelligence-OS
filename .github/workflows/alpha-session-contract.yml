permissions:
  contents: read

jobs:
  offline-contract:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14.7'
      - name: Exclusive preparation roots
        run: |
          set -eu
          cd /private/tmp
          test_root=$(mktemp -d iios-provider-connection-source-tests-observation-XXXXXXXX)
          spine_root=$(mktemp -d iios-sb38d-source-tests-XXXXXXXX)
          echo "IIOS_GATEWAY_TEST_ROOT=$PWD/$test_root" >> "$GITHUB_ENV"
          echo "IIOS_SB38D_TEST_ROOT=$PWD/$spine_root" >> "$GITHUB_ENV"
          echo "TMPDIR=$PWD/$test_root" >> "$GITHUB_ENV"
          echo "PYTHONDONTWRITEBYTECODE=1" >> "$GITHUB_ENV"
      - name: Verify pinned historical bases
        run: |
          set -eu
          python -B - <<'PYBASE'
          import json,os,subprocess
          from pathlib import Path
          HISTORICAL_BASES=('3342c9629131a69254f2ceef8c0a5f6cf657530c',
                            'ae465e1d41f895e2e5fc1b8ee85b628270f7c74e')
          def verify_historical_bases(run=subprocess.run):
              def git(*args):
                  try:
                      result=run(['git',*args],check=True,capture_output=True,text=True,timeout=60)
                  except (subprocess.SubprocessError,OSError):
                      raise RuntimeError('PINNED_BASE_COMMAND_FAILED') from None
                  return result.stdout.strip()
              head=git('rev-parse','--verify','HEAD^{commit}')
              for base in HISTORICAL_BASES:
                  git('fetch','--no-tags','--no-recurse-submodules','--depth=1','origin',base)
                  if git('rev-parse','--verify','FETCH_HEAD^{commit}')!=base:
                      raise RuntimeError('PINNED_BASE_FETCH_MISMATCH')
                  if git('rev-parse','--verify',base+'^{commit}')!=base or git('cat-file','-t',base)!='commit':
                      raise RuntimeError('PINNED_BASE_OBJECT_MISMATCH')
              if git('rev-parse','--verify','HEAD^{commit}')!=head:
                  raise RuntimeError('PINNED_BASE_HEAD_CHANGED')
              return dict(head=head,bases=list(HISTORICAL_BASES),verified=True)
          result=verify_historical_bases()
          with (Path(os.environ['IIOS_GATEWAY_TEST_ROOT'])/'historical-bases.json').open('x') as f:
              json.dump(result,f,sort_keys=True)
          PYBASE
