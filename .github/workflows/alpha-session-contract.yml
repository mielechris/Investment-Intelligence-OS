          passed=result.wasSuccessful() and result.testsRun>0 and not result.skipped and not blocked and failure is None and source_unchanged
          put('results.json',dict(scope='PREPARATION_OFFLINE_ONLY',head=head,tests=result.testsRun,
              failures=len(result.failures),errors=len(result.errors),skipped=len(result.skipped),blocked=blocked,
              failure_category=failure,passed=passed,seconds=time.monotonic()-start,rows=result.rows,
              source_unchanged=source_unchanged,production_qualified=False,selected_mac_qualified=False,native_execution=False,
              credential_access=False,provider_access=False,broker_connected=False,paper_order_permission=False,
              trade_execution_permission=False,live_execution=False))
          put('environment.json',dict(python=sys.version,executable=sys.executable,executable_sha256=sha(Path(sys.executable).read_bytes()),
              system=platform.system(),release=platform.release(),version=platform.version(),architecture=platform.machine(),
              image={k:os.environ.get(k,'UNAVAILABLE') for k in ('ImageOS','ImageVersion','RUNNER_OS','RUNNER_ARCH')},
              tls=ssl.OPENSSL_VERSION,module_closure=closure))
          put('artifact-hashes.json',{p.name:sha(p.read_bytes()) for p in evidence.iterdir() if p.is_file()})
          print(json.dumps(dict(head=head,tests=result.testsRun,passed=passed,seconds=time.monotonic()-start)))
          sys.exit(0 if passed else 1)
          PYTEST
      - name: Whitespace and workflow parser
        run: |
          set -eu
          git diff --check ae465e1d41f895e2e5fc1b8ee85b628270f7c74e HEAD
          ruby -ryaml -e 'x=YAML.load_file(ARGV[0]); abort unless x.fetch("jobs").keys == ["offline-contract"]; x.fetch("jobs").each_value { |j| j.fetch("steps").each_with_index { |s,i| next unless s["run"]; p=File.join(ENV.fetch("IIOS_GATEWAY_TEST_ROOT"),"shell-#{i}.sh"); File.open(p,"wx") { |f| f.write(s["run"]) }; abort unless system("/bin/bash","-n",p) } }' .github/workflows/alpha-session-contract.yml
      - name: Export sanitized preparation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: alpha-observation-offline-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ env.IIOS_GATEWAY_TEST_ROOT }}/evidence/
