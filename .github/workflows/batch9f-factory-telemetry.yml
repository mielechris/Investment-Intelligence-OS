name: IIOS Batch 9F Factory Telemetry Gate

on:
  push:
    branches:
      - feature/batch9f-factory-telemetry
  pull_request:
    branches:
      - feature/batch9e-high-speed-market-radar

jobs:
  telemetry-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile Batch 9F telemetry
        run: >-
          python -m py_compile
          "BACK END/backend/factory_telemetry.py"
          "BACK END/backend/test_factory_telemetry.py"
          scripts/iios_factory_telemetry_exporter.py
      - name: Run read-only telemetry contract
        run: python "BACK END/backend/test_factory_telemetry.py"
      - name: Assert telemetry has no ledger mutation or execution authority
        run: |
          ! grep -Eq 'record_object|record_event|consume_authorization|consume_paper_authorization|submit_paper_order|create_governed_paper_order' "BACK END/backend/factory_telemetry.py"
          ! grep -Eq '"live_execution"[[:space:]]*:[[:space:]]*True' "BACK END/backend/factory_telemetry.py" scripts/iios_factory_telemetry_exporter.py
          ! grep -Eq '"trade_execution_permission"[[:space:]]*:[[:space:]]*True' "BACK END/backend/factory_telemetry.py" scripts/iios_factory_telemetry_exporter.py
          grep -q 'mode=ro' "BACK END/backend/factory_telemetry.py"
          grep -q 'target GitHub repository.*must be private' scripts/iios_factory_telemetry_exporter.py
      - name: Assert sanitized telemetry boundaries
        run: |
          grep -q '"raw_prompts_exported": False' "BACK END/backend/factory_telemetry.py"
          grep -q '"raw_evidence_exported": False' "BACK END/backend/factory_telemetry.py"
          grep -q '"secrets_exported": False' "BACK END/backend/factory_telemetry.py"
          ! grep -Eq 'OPENAI_API_KEY|XAI_API_KEY|GEMINI_API_KEY|KIMI_API_KEY' "BACK END/backend/factory_telemetry.py"
