name: IIOS Native Qualification v2
on:
  push:
    branches: [feature/iios-native-qualification-v2]
  workflow_dispatch:
    inputs:
      native:
        description: Execute selected-Mac native qualification (leave false for preparation only)
        type: boolean
        default: false
      resume:
        description: Explicitly resume after reviewing the previous RED checkpoint
        type: boolean
        default: false
      rebuild_runtime:
        description: Preserve and rebuild the project venv once
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: iios-selected-mac-native-qualification
  cancel-in-progress: false
jobs:
  preparation:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Trusted dispatch ref
        if: github.event_name == 'workflow_dispatch' && inputs.native
        env:
          TRUSTED_REF: ${{ vars.IIOS_NATIVE_TRUSTED_REF }}
        run: test -n "$TRUSTED_REF" && test "$GITHUB_REF" = "$TRUSTED_REF"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - name: Validate workflow structure
        run: |
          ruby -ryaml -e 'w=YAML.load_file(ARGV[0]); t=w["on"]||w[true]; abort unless t["push"]["branches"]==["feature/iios-native-qualification-v2"]; abort unless t["workflow_dispatch"]["inputs"]["native"]["default"]==false; abort unless w["jobs"]["selected-mac"]["if"].include?("inputs.native"); puts "Workflow structure PASS"' .github/workflows/iios-native-qualification-v2.yml
          sh -n scripts/iios-native-qualify
      - name: Offline preparation only
        run: python -B scripts/iios-native-prepare.py --initialize-roots
      - name: Export preparation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-v2-preparation-${{ github.sha }}
          path: ~/Library/IIOS/evidence/preparation-*
          if-no-files-found: error
          retention-days: 30
  selected-mac:
    if: github.event_name == 'workflow_dispatch' && inputs.native
    needs: preparation
    environment: iios-native-qualification
    runs-on: [self-hosted, macOS, ARM64, iios-selected-mac]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          clean: true
      - name: Selected-Mac native qualification
        shell: bash
        env:
          EXPLICIT_RESUME: ${{ inputs.resume }}
          REBUILD_RUNTIME: ${{ inputs.rebuild_runtime }}
        run: |
          set -euo pipefail
          umask 077
          args=(--profile observation)
          if [[ "$EXPLICIT_RESUME" == true ]]; then args+=(--resume); fi
          if [[ "$REBUILD_RUNTIME" == true ]]; then args+=(--rebuild-runtime); fi
          ./scripts/iios-native-qualify "${args[@]}"
