name: IIOS Native Qualification v2
on:
  push:
    branches: [feature/iios-native-qualification-v2]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: iios-native-v2-public-preparation
  cancel-in-progress: false
jobs:
  preparation:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - name: Validate workflow structure
        run: |
          ruby -ryaml -e 'w=YAML.load_file(ARGV[0]); t=w["on"]||w[true]; abort unless t["push"]["branches"]==["feature/iios-native-qualification-v2"]; abort unless w["jobs"].keys==["preparation"]; puts "Workflow structure PASS"' .github/workflows/iios-native-qualification-v2.yml
          sh -n scripts/iios-native-qualify
      - name: Offline preparation only
        run: python -B scripts/iios-native-prepare.py --initialize-roots
      - name: Export preparation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-v2-preparation-${{ github.sha }}
          path: ~/Library/IIOS/evidence/preparation-*
          if-no-files-found: error
          retention-days: 30
