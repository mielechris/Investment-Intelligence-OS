name: IIOS Batch 10M Grok Cost Enforcement Gate

on:
  push:
    branches:
      - feature/batch10m-grok-cost-enforcement-final2
  pull_request:
    branches:
      - experiment/grok-intelligence-v1

jobs:
  cost-enforcement-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile enforcement artifacts
        run: |
          python -m py_compile \
            'BACK END/backend/model_cost_enforcement.py' \
            'BACK END/backend/grok_xai_sdk_adapter.py' \
            'BACK END/backend/grok_router_registry.py' \
            scripts/activate_batch10m_grok_cost_enforcement.py \
            scripts/activate_batch10m_grok_cost_enforcement_v2.py \
            scripts/test_batch10m_grok_cost_enforcement.py \
            scripts/test_batch10m_grok_router_wiring.py
      - name: Run binding governor unit tests
        env:
          PYTHONPATH: BACK END/backend
        run: |
          python -m pytest -q \
            'BACK END/backend/test_model_cost_enforcement_unit.py' \
            'BACK END/backend/test_grok_xai_sdk_adapter.py' \
            scripts/test_batch10m_grok_cost_enforcement.py \
            scripts/test_batch10m_grok_router_wiring.py
      - name: Assert safety, router, and no-secret invariants
        run: |
          grep -q 'daily_hard_limit_usd.*20.0' 'BACK END/backend/model_cost_enforcement.py'
          grep -q 'rolling_7d_hard_limit_usd.*75.0' 'BACK END/backend/model_cost_enforcement.py'
          grep -q 'duplicate_query_ttl_seconds.*1800' 'BACK END/backend/model_cost_enforcement.py'
          grep -q 'cost_governor_binding' 'BACK END/backend/grok_xai_sdk_adapter.py'
          grep -q 'grok_social_intelligence' 'BACK END/backend/grok_router_registry.py'
          grep -q 'grok_value_scheduler' 'BACK END/backend/grok_router_registry.py'
          grep -q 'CONTROLLED_BACKEND_8002_RELOAD_REQUIRED' scripts/activate_batch10m_grok_cost_enforcement_v2.py
          grep -q 'trade_execution_permission.*False' 'BACK END/backend/model_cost_enforcement.py'
          grep -q 'capital_authority.*False' 'BACK END/backend/model_cost_enforcement.py'
          grep -q 'live_execution.*False' 'BACK END/backend/model_cost_enforcement.py'
          if grep -q 'secret-never-persist' 'BACK END/backend/model_cost_enforcement.py'; then exit 1; fi
