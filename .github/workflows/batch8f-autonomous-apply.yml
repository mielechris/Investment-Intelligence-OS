name: IIOS Batch 8F autonomous apply

on:
  push:
    branches:
      - feature/batch8-paper-portfolio
    paths:
      - scripts/apply_batch8f.py
      - .github/workflows/batch8f-autonomous-apply.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: iios-batch8f-autonomous-apply
  cancel-in-progress: false

jobs:
  apply-batch8f:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Batch 8 branch
        uses: actions/checkout@v4
        with:
          ref: feature/batch8-paper-portfolio
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend runtime dependencies
        run: pip install fastapi uvicorn openai python-dotenv certifi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: FRONT END/package-lock.json

      - name: Install frontend dependencies
        working-directory: FRONT END
        run: npm ci

      - name: Configure integration commit identity
        run: |
          git config user.name "mielechris"
          git config user.email "34699111+mielechris@users.noreply.github.com"

      - name: Apply and validate Batch 8F
        env:
          PYTHONWARNINGS: error::ResourceWarning
        run: python scripts/apply_batch8f.py
