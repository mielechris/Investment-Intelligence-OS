name: IIOS Batch 10L-10M Measurement Health Gate

on:
  push:
    branches:
      - feature/batch10l-10m-measurement-health-superbatch
  pull_request:
    branches:
      - feature/batch10k-historical-macro-regime-library

jobs:
  measurement-health-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile superbatch
        run: >-
          python -m py_compile
          scripts/iios_benchmark_alpha_attribution.py
          scripts/iios_data_health_watchdog.py
          scripts/iios_measurement_health_publisher.py
          scripts/activate_batch10l_10m_measurement_health_superbatch.py
          scripts/test_batch10l_10m_measurement_health_superbatch.py
      - name: Run measurement and health contracts
        run: PYTHONPATH=scripts python scripts/test_batch10l_10m_measurement_health_superbatch.py
      - name: Build browser
        working-directory: FRONT END
        run: |
          npm ci
          npm run build
