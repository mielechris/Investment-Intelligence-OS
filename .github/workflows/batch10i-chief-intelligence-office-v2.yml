name: IIOS Batch 10I Chief Intelligence Office V2 Gate

on:
  push:
    branches:
      - feature/batch10i-chief-intelligence-office-v2
  pull_request:
    branches:
      - feature/batch10h-historical-market-intelligence

jobs:
  chief-intelligence-office-v2-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Compile 10I
        run: >-
          python -m py_compile
          scripts/iios_chief_intelligence_office_v2.py
          scripts/test_batch10i_chief_intelligence_office_v2.py
          scripts/activate_batch10i_chief_intelligence_office_v2.py
          scripts/iios_final_institutional_publisher.py
          scripts/activate_batch9k_live_factory_browser.py

      - name: Run inherited qualification and historical regressions
        run: |
          python scripts/test_batch10g_qualification_watch.py
          python scripts/test_batch10h_historical_market_intelligence.py
          python scripts/test_batch10h_publisher_contract.py
          if [ -f scripts/test_batch10h_system_trust_runtime.py ]; then python scripts/test_batch10h_system_trust_runtime.py; fi

      - name: Run 10I whole-stack advisory contract
        run: python scripts/test_batch10i_chief_intelligence_office_v2.py

      - name: Build browser with 10I room
        working-directory: FRONT END
        run: |
          npm ci
          npx eslint src/LiveFactoryBrowser.tsx src/ChiefIntelligenceOfficeV2.tsx src/ChiefIntelligenceOffice.tsx src/HistoricalMarketIntelligence.tsx src/QualificationWatch.tsx
          npm run build

      - name: Assert 10I consumes the modern stack
        run: |
          grep -q 'HISTORICAL_EVENT_RECONSTRUCTION' scripts/iios_chief_intelligence_office_v2.py
          grep -q 'HISTORICAL_REGIME_LIBRARY' scripts/iios_chief_intelligence_office_v2.py
          grep -q 'BENCHMARK_ALPHA_ATTRIBUTION' scripts/iios_chief_intelligence_office_v2.py
          grep -q 'DATA_HEALTH_WATCHDOG' scripts/iios_chief_intelligence_office_v2.py
          grep -q 'PAPER_EVIDENCE_CAMPAIGN' scripts/iios_chief_intelligence_office_v2.py
          grep -q 'chief_intelligence_office_v2.json' scripts/iios_final_institutional_publisher.py
          grep -q 'ChiefIntelligenceOfficeV2' "FRONT END/src/LiveFactoryBrowser.tsx"
          grep -q 'The factory audits the factory.' "FRONT END/src/ChiefIntelligenceOfficeV2.tsx"

      - name: Assert build versus wait policy
        run: |
          grep -q 'BUILD_RESEARCH_DATA_LAYER' scripts/iios_chief_intelligence_office_v2.py
          grep -q 'BUILD_MEASUREMENT_LAYER' scripts/iios_chief_intelligence_office_v2.py
          grep -q 'BUILD_OPERATING_CONTROL' scripts/iios_chief_intelligence_office_v2.py
          grep -q 'WAIT_FOR_EVIDENCE' scripts/iios_chief_intelligence_office_v2.py
          grep -q 'shadow_when' scripts/iios_chief_intelligence_office_v2.py

      - name: Assert no autonomous authority
        run: |
          grep -q '"auto_apply_recommendations": False' scripts/iios_chief_intelligence_office_v2.py
          grep -q '"auto_change_thresholds": False' scripts/iios_chief_intelligence_office_v2.py
          grep -q '"auto_change_agent_weights": False' scripts/iios_chief_intelligence_office_v2.py
          grep -q '"auto_change_model_routing": False' scripts/iios_chief_intelligence_office_v2.py
          grep -q '"provider_change_authority": False' scripts/iios_chief_intelligence_office_v2.py
          grep -q '"broker_connection_authority": False' scripts/iios_chief_intelligence_office_v2.py
          grep -q '"capital_authority": False' scripts/iios_chief_intelligence_office_v2.py
          grep -q '"trade_execution_permission": False' scripts/iios_chief_intelligence_office_v2.py
          grep -q '"live_execution": False' scripts/iios_chief_intelligence_office_v2.py
          ! grep -Eq '"(auto_apply_recommendations|auto_change_thresholds|auto_change_agent_weights|auto_change_model_routing|provider_change_authority|broker_connection_authority|capital_authority|trade_execution_permission|live_execution)"[[:space:]]*:[[:space:]]*True' scripts/iios_chief_intelligence_office_v2.py scripts/activate_batch10i_chief_intelligence_office_v2.py

      - name: Assert 10H and live checkout are preserved
        run: |
          grep -q 'com.iios.historical-market-intelligence.plist' scripts/activate_batch10i_chief_intelligence_office_v2.py
          grep -q '10H 24/7 historical research: PRESERVED' scripts/activate_batch10i_chief_intelligence_office_v2.py
          grep -q 'Existing Backend 8002: UNCHANGED' scripts/activate_batch10i_chief_intelligence_office_v2.py
          grep -q 'Live checkout changed during 10I activation' scripts/activate_batch10i_chief_intelligence_office_v2.py
