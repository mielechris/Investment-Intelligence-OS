name: IIOS Batch 8F checks

on:
  push:
    branches:
      - feature/batch8-paper-portfolio
  pull_request:
    branches:
      - main

jobs:
  batch8f-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BACK END/backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: pip install fastapi uvicorn openai python-dotenv certifi
      - name: Compile Batch 8F stack
        run: >-
          python -m py_compile
          app.py model_scale_validation.py
          test_group_batch8f_scale_validation.py
          multi_model_intelligence_council.py
          test_group_batch8e_multi_model_council.py
          kimi_provider.py kimi_swarm_bridge.py
          kimi_research_intelligence.py
          batch8c_production_inputs.py
          ../../scripts/apply_batch8f.py
          ../../scripts/smoke_batch8f_live.py
      - name: Run Batch 8F regression stack
        run: >-
          PYTHONWARNINGS="error::ResourceWarning" python -m unittest -v
          test_group_batch8f_scale_validation.py
          test_group_batch8e_multi_model_council.py
          test_group_batch8d_kimi_research.py
          test_group_batch8c_production_inputs.py
          test_group_batch8b_live_sources.py
          test_group_batch8a_jesse_intelligence.py
          test_group_batch7_factory_genericization.py
          test_group_batch6_generic_coverage.py
          test_governed_chain_end_to_end.py

  batch8f-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FRONT END
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: FRONT END/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Build Factory UI
        run: npm run build
