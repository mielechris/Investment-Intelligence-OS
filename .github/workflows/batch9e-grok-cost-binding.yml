name: IIOS Batch 9E Grok Cost Binding Gate

on:
  push:
    branches:
      - feature/batch9e-high-speed-market-radar

jobs:
  grok-cost-binding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile 9E Grok cost boundary
        run: >-
          python -m py_compile
          "BACK END/backend/grok_provider.py"
          scripts/launch_batch9e_live_paper_factory.py
          scripts/test_batch9e_grok_cost_binding.py
      - name: Run 9E Grok cost binding regression
        run: python -m pytest -q scripts/test_batch9e_grok_cost_binding.py
      - name: Assert binding, bounded request, and safety invariants
        run: |
          grep -q 'COST_GOVERNOR_BINDING = True' "BACK END/backend/grok_provider.py"
          grep -q 'REQUEST_RETRIES = 0' "BACK END/backend/grok_provider.py"
          grep -q 'MAX_OUTPUT_TOKENS = 2000' "BACK END/backend/grok_provider.py"
          grep -q 'prompt_cache_key' "BACK END/backend/grok_provider.py"
          grep -q 'preflight_xai_request' "BACK END/backend/grok_provider.py"
          grep -q 'record_xai_response' "BACK END/backend/grok_provider.py"
          grep -q 'model_cost_enforcement.py' scripts/launch_batch9e_live_paper_factory.py
          grep -q 'Grok cost admission/accounting: BINDING' scripts/launch_batch9e_live_paper_factory.py
          ! grep -q 'trade_execution_permission.*True' "BACK END/backend/grok_provider.py"
          ! grep -q 'live_execution.*True' "BACK END/backend/grok_provider.py"
