services:
  backend:
    build:
      context: ./BACK END/backend
    env_file:
      - ./BACK END/backend/.env
    environment:
      IIOS_DB_PATH: /data/iios.db
    ports:
      - "8000:8000"
    volumes:
      - iios_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/intelligence/feeds/status', timeout=5)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./FRONT END
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  iios_data:
